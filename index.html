<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <!-- 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== [페이지 상단: 헤더] ==================== -->
  <header>
    <!-- 카페 로고 (이모지) -->
    <div class="logo" style="font-size: 3rem;">☕</div>
    <!-- 카페 이름 -->
    <h1>바이브 카페</h1>
    <!-- 부제 -->
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- 주문서와 주문 내역을 전환하는 탭 -->
  <nav class="tab-list" role="tablist" aria-label="주문 메뉴">
    <button id="order-tab" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="order-panel">
      ☕ 주문하기
    </button>
    <button id="history-tab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="history-panel">
      📋 주문 내역 <span id="order-count" class="tab-count">0</span>
    </button>
  </nav>

  <!-- ==================== [주문서 폼 영역] ==================== -->
  <main>
    <section id="order-panel" class="tab-panel" role="tabpanel" aria-labelledby="order-tab">
    <!-- novalidate: 자바스크립트로 유효성 검사를 진행하기 위해 브라우저 기본 유효성 검사 비활성화 -->
    <form id="order-form" novalidate>

      <!-- 1. 이름 (필수, text) -->
      <div class="form-group">
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customer-name" placeholder="이름을 입력해주세요">
      </div>

      <!-- 2. 전화번호 (tel) -->
      <div class="form-group">
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customer-phone" placeholder="010-0000-0000">
      </div>

      <!-- 3. 메뉴 선택 (드롭다운) -->
      <div class="form-group">
        <label for="beverage-select">메뉴 선택</label>
        <select id="beverage-select" name="beverage">
          <option value="" data-price="0">-- 메뉴를 선택하세요 --</option>
          <optgroup label="음료">
            <option value="americano" data-price="3500">아메리카노 3,500원</option>
            <option value="latte" data-price="4000">카페라떼 4,000원</option>
            <option value="mocha" data-price="4500">카페모카 4,500원</option>
            <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
            <option value="matcha-latte" data-price="4500">말차라떼 4,500원</option>
            <option value="chocolate-latte" data-price="4500">초코라떼 4,500원</option>
          </optgroup>
        </select>
      </div>

      <!-- 4. 사이즈 (라디오) -->
      <fieldset class="form-group">
        <legend>사이즈</legend>
        <div>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S +0원</label>
        </div>
        <div>
          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M +500원</label>
        </div>
        <div>
          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L +1,000원</label>
        </div>
      </fieldset>

      <!-- 5. 추가 옵션 (체크박스) -->
      <fieldset class="form-group">
        <legend>추가 옵션</legend>
        <div>
          <input type="checkbox" id="option-shot" name="option" value="shot" data-price="500">
          <label for="option-shot">샷 추가 +500원</label>
        </div>
        <div>
          <input type="checkbox" id="option-cream" name="option" value="cream" data-price="500">
          <label for="option-cream">크림 추가 +500원</label>
        </div>
        <div>
          <input type="checkbox" id="option-syrup" name="option" value="syrup" data-price="300">
          <label for="option-syrup">시럽 추가 +300원</label>
        </div>
        <div>
          <input type="checkbox" id="option-decaf" name="option" value="decaf" data-price="0">
          <label for="option-decaf">디카페인 +0원</label>
        </div>
      </fieldset>

      <!-- 6. 수량 (number, 최소 1, 최대 10, 기본값 1) -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 (textarea) -->
      <div class="form-group">
        <label for="special-requests">요청사항</label>
        <textarea id="special-requests" name="requests" rows="4" placeholder="요청사항을 입력해주세요"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 (주문하기 버튼 바로 위) -->
      <div id="estimated-price-area" class="price-area">
        <p>예상 금액: <span id="estimated-price">0</span>원</p>
      </div>

      <!-- 9 & 10. 주문하기 버튼 및 다시 작성 버튼 -->
      <div class="button-group">
        <button type="submit" id="submit-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>

    </form>

    <!-- 11. 주문 확인 메시지가 나올 빈 영역 (처음에는 숨김) -->
    <div id="order-confirmation" hidden></div>
    </section>

    <!-- 접수한 주문의 목록과 합계 -->
    <section id="history-panel" class="tab-panel hidden" role="tabpanel" aria-labelledby="history-tab">
      <p id="empty-orders" class="empty-orders">아직 주문 내역이 없어요 ☕</p>
      <div id="orders-list" class="orders-list"></div>
      <div id="orders-summary" class="orders-summary hidden">
        <p id="orders-total"></p>
        <button id="clear-orders-btn" class="clear-orders-button" type="button">내역 모두 지우기</button>
      </div>
    </section>

  </main>

  <!-- Supabase JavaScript v2 라이브러리를 먼저 불러옵니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 외부 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
